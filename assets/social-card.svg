<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Michael Klug — Less friction. More flow.</title><desc id="desc">Platform engineering, with a human perspective.</desc>
  <rect width="1200" height="630" fill="#f5f3ed"/>
  <path d="M64 115h1072" stroke="#d6d7cf"/>
  <text x="64" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="-4" fill="#222824">mk<tspan fill="#ef643f">.</tspan></text>
  <text x="178" y="78" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#222824">Michael Klug</text>
  <text x="1136" y="77" text-anchor="end" font-family="monospace" font-size="13" fill="#62685f">PLATFORM ARCHITECT / AUSTRIA</text>
  <text x="64" y="253" font-family="Arial,sans-serif" font-size="93" font-weight="600" letter-spacing="-6" fill="#222824">Less friction.</text>
  <text x="64" y="360" font-family="Arial,sans-serif" font-size="93" font-weight="600" letter-spacing="-6" fill="#222824">More <tspan font-family="Georgia,serif" font-style="italic" font-weight="400" fill="#ab361c">flow.</tspan></text>
  <text x="67" y="440" font-family="Arial,sans-serif" font-size="23" fill="#62685f">Complex systems. Human perspective.</text>
  <g transform="translate(957 302) rotate(-25)" stroke="#ef643f" stroke-width="2" fill="none"><circle r="155"/><ellipse rx="100" ry="155"/><ellipse rx="40" ry="155"/><ellipse rx="155" ry="55"/><path d="M-155 0h310M0-155v310"/></g>
  <rect y="526" width="1200" height="104" fill="#222824"/>
  <text x="64" y="585" font-family="monospace" font-size="16" fill="#f5f3ed">KUBERNETES</text><text x="274" y="585" font-family="monospace" font-size="16" fill="#ef643f">✳</text><text x="349" y="585" font-family="monospace" font-size="16" fill="#f5f3ed">GITOPS</text><text x="494" y="585" font-family="monospace" font-size="16" fill="#ef643f">✳</text><text x="574" y="585" font-family="monospace" font-size="16" fill="#f5f3ed">OBSERVABILITY</text><text x="815" y="585" font-family="monospace" font-size="16" fill="#ef643f">✳</text><text x="892" y="585" font-family="monospace" font-size="16" fill="#f5f3ed">DEVELOPER EXPERIENCE</text>
